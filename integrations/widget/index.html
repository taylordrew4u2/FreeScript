<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#eee8dd;color:#342f29;font:12px/1.6 Courier,monospace}header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid #d4c7b3;gap:12px}header strong{font-size:18px;letter-spacing:-1px}header span{font-size:10px;color:#786a55}nav{display:flex;gap:8px;padding:10px 22px;flex-wrap:wrap}button{font:11px Courier,monospace;padding:7px 10px;border:1px solid #baad98;background:#f9f4e9;color:#342f29;border-radius:2px;cursor:pointer}button:hover{background:#ddd0bb}button:focus-visible{outline:2px solid #584630;outline-offset:2px}main{padding:8px 22px 22px}article{background:#fffdf6;border:1px solid #d4c7b3;padding:30px 34px;max-height:580px;overflow:auto}h1{font:bold 17px Courier,monospace;text-transform:uppercase;text-align:center;margin:8px 0 3px}.author{text-align:center;color:#958773;margin:0 0 32px;font-size:10px}.block{white-space:pre-wrap;overflow-wrap:break-word;margin-bottom:13px;font-size:12px;line-height:1.5}.scene{font-weight:bold;text-transform:uppercase;margin-top:23px}.character{margin:17px 0 0 40%;text-transform:uppercase}.dialogue{margin:0 10% 14px 20%}.parenthetical{margin:0 18% 0 30%}.transition{text-align:right;text-transform:uppercase}footer{font-size:10px;color:#85745e;padding:10px 22px;border-top:1px solid #d4c7b3}#status{min-height:18px;font-size:10px;padding:0 22px;color:#705e44}textarea{width:100%;height:160px;font:11px Courier,monospace;background:#fffdf6;border:1px solid #b9aa93;padding:10px;color:#342f29}#fallback{padding:0 22px 20px}#outline{font-size:11px;padding:10px 20px;background:#f8f2e7;margin-bottom:12px}#outline a{display:block;color:#5c4b34;padding:4px 0;text-decoration:underline}p.empty{color:#96856a;text-align:center;padding:50px 10px}@media(max-width:400px){article{padding:20px}header,nav,main{padding-left:12px;padding-right:12px}header span{display:none}}
</style></head><body><header><strong>▤ FreeScript</strong><span>THE WRITING ROOM</span></header><nav><button id="outline-button">Scene list</button><button id="fountain-button">Copy Fountain</button><button id="json-button">Copy for Mac app</button></nav><div id="status" role="status"></div><main><div id="outline" hidden></div><article id="paper"><p class="empty">Your screenplay will appear here.</p></article></main><div id="fallback" hidden><label for="copy-text">Select and copy the text below:</label><textarea id="copy-text" readonly></textarea></div><footer id="stats">Cream paper. Dark ink. Your story.</footer><script>__SCRIPT__</script></body></html>
